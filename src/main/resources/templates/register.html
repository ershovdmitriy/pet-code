<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #5cb85c; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 14px; text-align: center; }
        .link { text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Регистрация</h2>
    <form th:action="@{/auth/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
            <label for="login">Логин</label>
            <input type="text" id="login" name="login" required />
        </div>
        <div>
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Зарегистрироваться</button>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div class="link">
            <a th:href="@{/auth/login}">Уже есть аккаунт? Войти</a>
        </div>
    </form>
</div>
</body>
</html>
