<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pet Code</title>
</head>
<body>
<h1>Список задач</h1>
<ul>
    <li th:each="task : ${tasks}">
        <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}"></a>
    </li>
</ul>
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>
</body>
</html>
