<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Задача: [[${task.title}]]</title>
</head>
<body>
<h1 th:text="${task.title}">Заголовок</h1>
<p th:text="${task.description}">Описание</p>

<div th:if="${testCases != null and !testCases.isEmpty()}">
    <h3>Примеры:</h3>
    <ul>
        <li th:each="test : ${testCases}">
            <strong>Вход:</strong> <code th:text="${test.inputData}"></code><br/>
            <strong>Выход:</strong> <code th:text="${test.expectedOutput}"></code>
        </li>
    </ul>
</div>

<div>
    <h2>Отправить решение</h2>
    <form th:action="@{/tasks/{id}/solve(id=${task.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label for="code">Код:</label><br/>
            <textarea id="code" name="code" rows="15" cols="60" placeholder="Вставьте ваш код здесь"></textarea>
        </div>
        <button type="submit">Отправить</button>
    </form>
</div>

<a href="/">Назад к списку</a>
</body>
</html>
